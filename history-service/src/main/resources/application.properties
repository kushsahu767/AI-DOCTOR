server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_doctor?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${DATABASE_USERNAME:ai_doctor}
spring.datasource.password=${DATABASE_PASSWORD:ai_doctor}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
